# thin-edge.io CTRLX App
# Snapcraft configuration for packaging thin-edge.io as a ctrlX AUTOMATION app
# See https://snapcraft.io/docs/getting-started

name: ctrlx-cumulocity-thin-edge-io
title: thin-edge.io IoT Edge Framework
version: 0.1.8
grade: stable
summary: Open-source cloud-agnostic IoT edge framework for ctrlX AUTOMATION
description: |
  <!--
  author: Cumulocity GmbH
  url: https://thin-edge.io/
  -->
  thin-edge.io is an open-source and cloud-agnostic edge framework designed 
  for resource-constrained IoT edge devices. This app provides connectivity 
  to Cumulocity IoT, AWS IoT, and Azure IoT Hub platforms.
  
  Features:
  - Multi-cloud connectivity (Cumulocity, AWS, Azure)
  - Device management and monitoring
  - Software management
  - Log management
  - Configuration management
  - Remote access capabilities
  - MQTT messaging
  
  Components included:
  - tedge: Main CLI tool
  - tedge-agent: Agent for software/configuration management
  - tedge-mapper: Protocol translation (c8y/aws/azure)
  - tedge-watchdog: Health monitoring
  - Plugins: apt, remote access, file management
  - Mosquitto MQTT broker (local)

# Metadata
license: Apache-2.0
contact: https://github.com/thin-edge/thin-edge.io/discussions
website: https://thin-edge.io
source-code: https://github.com/thin-edge/thin-edge.io
issues: https://github.com/thin-edge/thin-edge.io/issues

base: core22
confinement: strict
icon: web/www/pictures/thin-edge-avatar.png

# Map hard-coded system paths used by tedge-agent binaries into snap locations.
# IMPORTANT: log-plugins binds from $SNAP (read-only) so that
# AppArmor allows executing them in strict confinement. $SNAP_DATA would cause
# Permission denied (os error 13) when tedge-agent tries to spawn the plugins.
layout:
  /usr/share/tedge/sm-plugins:
    bind: $SNAP_DATA/tedge/sm-plugins


architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [amd64, arm64]
    build-for: [arm64]

# Define apps and services
apps:
  # Directory setup service - runs ONCE before any other service
  setup-directories:
    command: scripts/setup-directories.sh
    daemon: oneshot
    environment:
      TZ: Europe/Berlin
    passthrough:
      remain-after-exit: true

  # Main CLI tool
  tedge:
    command: scripts/tedge-wrapper.sh
    aliases:
      - tedge
    environment:
      TZ: Europe/Berlin
      PATH: $SNAP/scripts:$SNAP/usr/local/bin:$SNAP/usr/bin:$SNAP/bin:$PATH
    plugs:
      - network
      - network-bind
      - removable-media
      - hardware-observe  # Needed to read system serial number

  # Device ID management script
  manage-device-id:
    command: scripts/manage-device-id.sh
    aliases:
      - tedge-manage-device-id
    environment:
      TZ: Europe/Berlin
      TEDGE_CONFIG_DIR: $SNAP_DATA/tedge
    plugs:
      - network
      - network-bind
      - hardware-observe  # Needed to read system serial number

  tedge-connect:
    command: scripts/connect-wrapper.sh
    aliases:
      - tedge-connect
    environment:
      TZ: Europe/Berlin
      PATH: $SNAP/scripts:$SNAP/usr/local/bin:$SNAP/usr/bin:$SNAP/bin:$PATH
      TEDGE_CONFIG_DIR: $SNAP_DATA/tedge
    plugs:
      - network
      - network-bind

  # Build information display
  build-info:
    command: scripts/show-build-info.sh
    aliases:
      - tedge-build-info
    environment:
      TZ: Europe/Berlin

  # tedge-agent service
  tedge-agent:
    command: scripts/tedge-service-wrapper.sh tedge-agent
    daemon: simple
    restart-condition: always
    environment:
      TZ: Europe/Berlin
      TEDGE_CONFIG_DIR: $SNAP_DATA/tedge
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
    plugs:
      - network
      - network-bind
      - system-observe  # Needed to monitor system resource usage (CPU, memory) for watchdog and health reporting
      - log-observe    # Needed so log plugins can call journalctl for service logs
      - snapd-control  # Needed for sm-plugin 'snap list' to report all installed snaps
    passthrough:
      restart-delay: 5s
      after:
        - setup-directories
        - mosquitto

  # tedge-mapper for Cumulocity IoT
  tedge-mapper-c8y:
    command: scripts/tedge-service-wrapper.sh tedge-mapper c8y
    daemon: simple
    restart-condition: on-failure
    environment:
      TZ: Europe/Berlin
      TEDGE_CONFIG_DIR: $SNAP_DATA/tedge
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
    plugs:
      - network
      - network-bind
    passthrough:
      restart-delay: 5s
      after:
        - setup-directories
        - mosquitto

  # tedge-mapper for AWS IoT
  tedge-mapper-aws:
    command: scripts/tedge-service-wrapper.sh tedge-mapper aws
    daemon: simple
    install-mode: disable
    restart-condition: on-failure
    environment:
      TZ: Europe/Berlin
      TEDGE_CONFIG_DIR: $SNAP_DATA/tedge
    plugs:
      - network
      - network-bind
    passthrough:
      restart-delay: 5s
      after:
        - setup-directories
        - mosquitto

  # tedge-mapper for Azure IoT
  tedge-mapper-az:
    command: scripts/tedge-service-wrapper.sh tedge-mapper az
    daemon: simple
    install-mode: disable
    restart-condition: on-failure
    environment:
      TZ: Europe/Berlin
      TEDGE_CONFIG_DIR: $SNAP_DATA/tedge
    plugs:
      - network
      - network-bind
    passthrough:
      restart-delay: 5s
      after:
        - setup-directories
        - mosquitto

  tedge-watchdog:
    command: scripts/watchdog-wrapper.sh
    daemon: simple
    restart-condition: always
    plugs:
      - network
      - network-bind
      - system-observe  # Needed to monitor service health and resource usage
    environment:
      TZ: Europe/Berlin
      TEDGE_CONFIG_DIR: $SNAP_DATA/tedge
    passthrough:
      restart-delay: 5s
      after:
        - setup-directories
        - mosquitto
        - tedge-agent
      
  # Plugins
  c8y-remote-access-plugin:
    command: scripts/tedge-service-wrapper.sh c8y-remote-access-plugin
    aliases:
      - c8y-remote-access-plugin
    plugs:
      - network
      - network-bind

  c8y-firmware-plugin:
    command: scripts/tedge-service-wrapper.sh c8y-firmware-plugin
    daemon: simple
    restart-condition: always
    after:
      - setup-directories
      - mosquitto
      - tedge-agent
    aliases:
      - c8y-firmware-plugin
    plugs:
      - network
      - network-bind

  tedge-file-config-plugin:
    command: scripts/tedge-service-wrapper.sh tedge-file-config-plugin
    aliases:
      - tedge-file-config-plugin
    plugs:
      - network

  # Mosquitto MQTT Broker (local)
  mosquitto:
    command: scripts/mosquitto-wrapper.sh
    daemon: simple
    restart-condition: always
    environment:
      TZ: Europe/Berlin
    plugs:
      - network
      - network-bind
    passthrough:
      restart-delay: 5s
      after:
        - setup-directories
      before:
        - tedge-agent
        - tedge-mapper-c8y
        - tedge-mapper-aws
        - tedge-mapper-az
        - tedge-watchdog
        - tedge-datalayer-bridge

  tedge-datalayer-bridge:
    command: scripts/tedge-service-wrapper.sh tedge-datalayer-bridge
    daemon: simple
    restart-condition: always
    plugs:
      - network
      - datalayer  # Needed to read ctrlX Data Layer nodes for cloud forwarding
    environment:
      TZ: Europe/Berlin
      RUST_LOG: info
    passthrough:
      after:
        - setup-directories
        - mosquitto

  tedge-log-upload-manager:
    command: scripts/tedge-service-wrapper.sh tedge-log-upload-manager
    daemon: simple
    restart-condition: always
    plugs:
      - network
      - log-observe
    environment:
      TZ: Europe/Berlin
      RUST_LOG: info
    passthrough:
      after:
        - setup-directories
        - mosquitto

  # Configuration Webserver (Rust)
  webserver:
    command: scripts/webserver-wrapper.sh
    daemon: simple
    restart-condition: always
    plugs:
      - network
      - network-bind
      - mount-observe
      - system-observe  # Needed to read system resource usage (RAM, CPU) for the status API
      - hardware-observe  # Needed to read system serial number via DMI
      - log-observe       # Needed for snapctl logs
      - licensing-service # Needed to query installed licenses via Unix socket
    slots:
      - package-run
    environment:
      TZ: Europe/Berlin
      RUST_LOG: ${SNAP_RUST_LOG:-info}
    passthrough:
      restart-delay: 5s
      after:
        - setup-directories
        - mosquitto

# Hook definitions
hooks:
  install:
    plugs:
      - hardware-observe  # Needed to read system serial number for device ID
      - log-observe       # Needed for snapctl logs in webserver
      - network
      - network-observe
      - snapd-control     # Needed for 'snap list' to build full snap inventory
  configure:
    plugs:
      - network
  post-refresh:
    plugs:
      - network
      - hardware-observe
      - log-observe
      - network-observe
      - snapd-control     # Needed for 'snap list' to build full snap inventory

# Slot definitions for ctrlX integration
slots:
  package-assets:
    interface: content
    content: package-assets
    source:
      read:
        - $SNAP/package-assets/thin-edge-io
  package-certificates:
    interface: content
    content: package-certificates
    source:
      write:
        - $SNAP_COMMON/package-certificates/thin-edge-io
  package-run:
    interface: content
    content: package-run
    source:
      write:
        - $SNAP_DATA/package-run/thin-edge-io

# Plug definitions
# Note: plugs defined here are NOT automatically assigned to all apps.
# Each plug is explicitly listed only in the app(s) that require it.
plugs:
  datalayer:
    interface: content
    content: datalayer
    target: $SNAP_DATA/.datalayer
  licensing-service:
    interface: content
    content: licensing-service
    target: $SNAP_DATA/licensing-service


# Build parts
parts:
  thin-edge-io:
    plugin: nil
    source: https://github.com/thin-edge/thin-edge.io.git
    source-type: git
    source-commit: 09f99970963ec2399ad3d6e617d6ac509430c53e
    build-packages:
      - pkg-config
      - libssl-dev
      - libsqlite3-dev
      - gcc-aarch64-linux-gnu
      - libssl3
      - libsqlite3-0
      - ca-certificates
      - tzdata
    override-build: |
      # Ensure cargo is in PATH
      export PATH="$HOME/.cargo/bin:$PATH"
      
      # Use separate target directory to avoid cache conflicts
      export CARGO_TARGET_DIR="$CRAFT_PART_BUILD/target"
      
      # Determine target architecture for cross-compilation
      if [ "$CRAFT_ARCH_BUILD_FOR" = "arm64" ]; then
        export CARGO_BUILD_TARGET="aarch64-unknown-linux-gnu"
        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="aarch64-linux-gnu-gcc"
        export CC_aarch64_unknown_linux_gnu="aarch64-linux-gnu-gcc"
        export PKG_CONFIG_ALLOW_CROSS=1
        TARGET_FLAG="--target aarch64-unknown-linux-gnu"
      else
        TARGET_FLAG=""
      fi
      
      # Clean to avoid cache issues
      cargo clean

      # Build all thin-edge.io binaries in release mode
      cargo build --release $TARGET_FLAG --bin tedge --bin tedge-p11-server
      
      # Create bin directory
      mkdir -p $CRAFT_PART_INSTALL/bin
      
      # Determine output directory based on target
      if [ "$CRAFT_ARCH_BUILD_FOR" = "arm64" ]; then
        OUTPUT_DIR="$CRAFT_PART_BUILD/target/aarch64-unknown-linux-gnu/release"
      else
        OUTPUT_DIR="$CRAFT_PART_BUILD/target/release"
      fi
      
      # Copy main binaries
      cp $OUTPUT_DIR/tedge $CRAFT_PART_INSTALL/bin/
      cp $OUTPUT_DIR/tedge-p11-server $CRAFT_PART_INSTALL/bin/
      
      # Create symlinks for multicall binary (tedge acts as all these binaries)
      # Use -sf to force overwrite existing symlinks on rebuild
      ln -sf tedge $CRAFT_PART_INSTALL/bin/tedge-agent
      ln -sf tedge $CRAFT_PART_INSTALL/bin/tedge-mapper
      ln -sf tedge $CRAFT_PART_INSTALL/bin/tedge-watchdog
      ln -sf tedge $CRAFT_PART_INSTALL/bin/tedge-write
      ln -sf tedge $CRAFT_PART_INSTALL/bin/c8y-remote-access-plugin
      ln -sf tedge $CRAFT_PART_INSTALL/bin/c8y-firmware-plugin
      ln -sf tedge $CRAFT_PART_INSTALL/bin/tedge-file-config-plugin
      ln -sf tedge $CRAFT_PART_INSTALL/bin/tedge-file-log-plugin
      ln -sf tedge $CRAFT_PART_INSTALL/bin/tedge-flows-plugin
      mkdir -p $CRAFT_PART_INSTALL/usr/share/tedge/config-plugins
      ln -sf ../../../../bin/tedge-file-config-plugin $CRAFT_PART_INSTALL/usr/share/tedge/config-plugins/file
      mkdir -p $CRAFT_PART_INSTALL/usr/share/tedge/log-plugins
      mkdir -p $CRAFT_PART_INSTALL/usr/share/tedge/diag-plugins
      # Note: log-plugins and diag-plugins are provided by scripts/log-plugins
      # and scripts/diag-plugins in the snap (included via the scripts part).

      # Strip binaries to reduce size
      aarch64-linux-gnu-strip $CRAFT_PART_INSTALL/bin/tedge $CRAFT_PART_INSTALL/bin/tedge-p11-server 2>/dev/null || strip $CRAFT_PART_INSTALL/bin/tedge $CRAFT_PART_INSTALL/bin/tedge-p11-server

  # Konfigurations- und Paket-Assets (zusammengefasst)
  configs-assets:
    plugin: dump
    source: ./configs
    organize:
      'fossinfo.json': meta/fossinfo.json
      'foss-offer.txt': meta/foss-offer.txt
      'portlist-description.json': meta/portlist-description.json
      'slotplug-description.json': meta/slotplug-description.json
      'unixsocket-description.json': meta/unixsocket-description.json
      'build-info.txt': meta/build-info.txt
      'i18n/*': meta/i18n/
      'package-manifest.json': package-assets/thin-edge-io/${SNAPCRAFT_PROJECT_NAME}.package-manifest.json
      'caddyfile': package-assets/thin-edge-io/caddyfile
    stage:
      - meta/*
      - package-assets/thin-edge-io/${SNAPCRAFT_PROJECT_NAME}.package-manifest.json
      - package-assets/thin-edge-io/caddyfile
      - meta/i18n/*
    override-prime: |
      craftctl default
      # Snap-Namen im Caddyfile durch den tatsächlichen Projektnamen ersetzen,
      # damit der Pfad korrekt ist wenn das Snap umbenannt wird.
      sed -i "s|/var/snap/ctrlx-cumulocity-thin-edge-io/|/var/snap/${SNAPCRAFT_PROJECT_NAME}/|g" \
        "$CRAFT_PRIME/package-assets/thin-edge-io/caddyfile"

  scripts:
    plugin: dump
    source: ./scripts
    organize:
      '*': scripts/
    override-prime: |
      craftctl default
      # tedge diag collect refuses to run plugins writable by non-root users.
      # The source files are 0775 (group-writable); strip group/world write bits.
      chmod 755 $CRAFT_PRIME/scripts/log-plugins/*
      chmod 755 $CRAFT_PRIME/scripts/diag-plugins/*
      chmod 755 $CRAFT_PRIME/scripts/diag-upload.sh
    stage:
      - scripts/*
      - scripts/log-plugins/
      - scripts/log-plugins/file
      - scripts/log-plugins/journald
      - scripts/diag-plugins/
      - scripts/diag-plugins/01_tedge.sh
      - scripts/diag-plugins/02_os.sh
      - scripts/diag-plugins/03_mqtt.sh
      - scripts/diag-plugins/04_workflow.sh
      - scripts/diag-plugins/05_entities.sh
      - scripts/diag-plugins/06_internal.sh
      - scripts/diag-plugins/07_mosquitto.sh
      - scripts/diag-plugins/08_truststore.sh
      - scripts/diag-upload.sh

  # Default operation workflows - shipped read-only in $SNAP,
  # copied to $SNAP_DATA/tedge/operations/ on install/refresh by setup-directories.sh
  default-operations:
    plugin: dump
    source: ./tedge/operations
    organize:
      '*': tedge/operations/

  hooks:
    plugin: dump
    source: ./snap/hooks
    organize:
      '*': snap/hooks/

  mosquitto:
    plugin: nil
    stage-packages:
      - mosquitto
      - mosquitto-clients
      - libssl3
    override-prime: |
      craftctl default
      # Create mosquitto config directory
      mkdir -p $CRAFT_PRIME/etc/mosquitto
      
      # Create MINIMAL default config - NO listener here, tedge-mosquitto.conf provides it
      cat > $CRAFT_PRIME/etc/mosquitto/default_config.conf << 'EOF'
      # Minimal mosquitto base config for snap
      # Listener and bridge settings come from $SNAP_DATA/tedge/mosquitto-conf/
      # via include_dir (added at runtime by mosquitto-wrapper.sh)
      persistence true
      persistence_location /var/snap/ctrlx-cumulocity-thin-edge-io/common/mosquitto/
      user root
      EOF
      
      # Create full example config for reference
      cat > $CRAFT_PRIME/etc/mosquitto/mosquitto.conf << 'EOF'
      # Full mosquitto configuration for thin-edge.io snap
      # This file is copied to $SNAP_COMMON as mosquitto_example.conf
      # Create $SNAP_COMMON/mosquitto.conf to customize settings
      
      # Run as root (required in snap environment)
      user root
      
      # Listen on localhost only for security
      listener 1883 127.0.0.1
      
      # Allow anonymous connections (internal only)
      allow_anonymous true
      
      # Persistence settings
      persistence true
      persistence_location /var/snap/ctrlx-cumulocity-thin-edge-io/common/mosquitto/
      
      # Logging
      log_dest syslog
      log_type error
      log_type warning
      log_type notice
      
      # Connection settings
      max_keepalive 65535
      max_connections -1
      EOF

  bridge-service:
    plugin: nil
    source: ./bridge-service-rust
    build-packages:
      - pkg-config
      - libssl-dev
      - gcc-aarch64-linux-gnu
    override-build: |
      # Ensure cargo is in PATH
      export PATH="$HOME/.cargo/bin:$PATH"
      
      # Use separate target directory to avoid cache conflicts
      export CARGO_TARGET_DIR="$CRAFT_PART_BUILD/target"
      
      # Determine target architecture for cross-compilation
      if [ "$CRAFT_ARCH_BUILD_FOR" = "arm64" ]; then
        export CARGO_BUILD_TARGET="aarch64-unknown-linux-gnu"
        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="aarch64-linux-gnu-gcc"
        export CC_aarch64_unknown_linux_gnu="aarch64-linux-gnu-gcc"
        export PKG_CONFIG_ALLOW_CROSS=1
        TARGET_FLAG="--target aarch64-unknown-linux-gnu"
        OUTPUT_DIR="$CRAFT_PART_BUILD/target/aarch64-unknown-linux-gnu/release"
        STRIP_CMD="aarch64-linux-gnu-strip"
      else
        TARGET_FLAG=""
        OUTPUT_DIR="$CRAFT_PART_BUILD/target/release"
        STRIP_CMD="strip"
      fi
      
      # Build with the host's Rust installation
      cargo build --release $TARGET_FLAG
      
      # Create bin directory
      mkdir -p $CRAFT_PART_INSTALL/bin
      
      # Copy binaries
      cp $OUTPUT_DIR/tedge-datalayer-bridge $CRAFT_PART_INSTALL/bin/
      cp $OUTPUT_DIR/tedge-log-upload-manager $CRAFT_PART_INSTALL/bin/
      
      # Strip binaries to reduce size
      $STRIP_CMD $CRAFT_PART_INSTALL/bin/tedge-datalayer-bridge
      $STRIP_CMD $CRAFT_PART_INSTALL/bin/tedge-log-upload-manager

  webserver:
    plugin: nil
    source: .
    build-packages:
      - pkg-config
      - gcc-aarch64-linux-gnu
    override-build: |
      cd web-server-rust
      # Ensure cargo is in PATH
      export PATH="$HOME/.cargo/bin:$PATH"
      
      # Use separate target directory to avoid cache conflicts
      export CARGO_TARGET_DIR="$CRAFT_PART_BUILD/target"
      
      # Determine target architecture for cross-compilation
      if [ "$CRAFT_ARCH_BUILD_FOR" = "arm64" ]; then
        export CARGO_BUILD_TARGET="aarch64-unknown-linux-gnu"
        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="aarch64-linux-gnu-gcc"
        export CC_aarch64_unknown_linux_gnu="aarch64-linux-gnu-gcc"
        export PKG_CONFIG_ALLOW_CROSS=1
        TARGET_FLAG="--target aarch64-unknown-linux-gnu"
        OUTPUT_DIR="$CRAFT_PART_BUILD/target/aarch64-unknown-linux-gnu/release"
        STRIP_CMD="aarch64-linux-gnu-strip"
      else
        TARGET_FLAG=""
        OUTPUT_DIR="$CRAFT_PART_BUILD/target/release"
        STRIP_CMD="strip"
      fi
      
      # Build with the host's Rust installation
      cargo build --release $TARGET_FLAG
      
      # Create bin directory
      mkdir -p $CRAFT_PART_INSTALL/bin
      
      # Copy binary
      cp $OUTPUT_DIR/tedge-web-config $CRAFT_PART_INSTALL/bin/
      
      # Strip binary to reduce size
      $STRIP_CMD $CRAFT_PART_INSTALL/bin/tedge-web-config

  # Systemd stub service files - needed so tedge-watchdog can read them without crashing
  # (watchdog checks for WatchdogSec in these files; missing file = crash, missing key = graceful warn)
  systemd-stubs:
    plugin: dump
    source: ./snap/local/systemd
    organize:
      '*': lib/systemd/system/

  # Web-Assets und Icons (zusammengefasst)
  web-assets:
    plugin: dump
    source: ./web/www
    organize:
      '*': web/www/
    override-prime: |
      craftctl default
      # Icons müssen sowohl in web/www/ (für den Webserver) als auch in meta/ (für den Snap) liegen
      cp $CRAFT_PRIME/web/www/pictures/thin-edge-avatar.png $CRAFT_PRIME/meta/icon.png

  # Default flows — shipped read-only in $SNAP, copied to $SNAP_DATA on install/refresh
  default-flows:
    plugin: dump
    source: ./mappings/c8y
    organize:
      '*': tedge-flows/mappers/c8y/
