name: autotag
#
# Create a git tag based on the version in snap/snapcraft.yaml if one does not already exist.
# Runs only after the Build workflow completes successfully on main.
# The created tag then triggers the release workflow.
#
on:
  workflow_run:
    workflows: ["Build Snap Packages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  create_tag:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.repository_owner == 'thin-edge'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PAT || secrets.GITHUB_TOKEN }}

      - name: Create tag if version changed
        run: |
          VERSION_BASE=$(grep "^version:" snap/snapcraft.yaml | awk '{print $2}' | tr -d '"' | cut -d. -f1,2)
          VERSION="${VERSION_BASE}.${{ github.event.workflow_run.run_number }}"
          if [ -z "$VERSION_BASE" ]; then
            echo "Could not detect base version from snap/snapcraft.yaml"
            exit 1
          fi
          if [ -n "$(git tag -l "$VERSION")" ]; then
            echo "Skipping: tag $VERSION already exists"
            exit 0
          fi
          git config --global user.email "info@thin-edge.io"
          git config --global user.name "Versioneer"
          echo "Creating tag: $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
