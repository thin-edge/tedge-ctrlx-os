[package]
name = "tedge-datalayer-bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tedge-datalayer-bridge"
path = "src/main.rs"

[[bin]]
name = "tedge-log-upload-manager"
path = "src/log_upload_manager.rs"

[dependencies]
paho-mqtt = "0.12"
tokio = { version = "1.45", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
uuid = { version = "1.11", features = ["v4"] }
# Not used directly - paho-mqtt-sys links against OpenSSL unconditionally (for its
# bundled Paho C library) and reqwest's still-enabled default-tls feature pulls in
# native-tls/openssl-sys too, even though we use rustls-tls at runtime. The
# "vendored" feature makes openssl-sys build its own OpenSSL from source for
# whichever target it's compiling for, instead of needing target-specific system
# OpenSSL dev headers (e.g. libssl-dev:arm64) installed in the cross-compile
# environment.
openssl = { version = "0.10", features = ["vendored"] }
futures = "0.3.32"
rumqttc = "0.25"
toml = "0.8"
glob = "0.3"
chrono = "0.4"

[features]
default = ["mqtt"]
mqtt = []