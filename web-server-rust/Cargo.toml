[package]
name = "tedge-web-config"
version = "1.0.0"
edition = "2021"
authors = ["thin-edge.io Contributors"]
license = "Apache-2.0"
description = "Configuration web interface for thin-edge.io on ctrlX AUTOMATION"

[dependencies]
actix-web = "=4.8.0"
actix-files = "=0.6.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
env_logger = "0.11"
log = "0.4"

# Pin dependencies for Rust 1.85 compatibility
[dependencies.actix-http]
version = "=3.8.0"

[dependencies.time]
version = "=0.3.36"

[[bin]]
name = "tedge-web-config"
path = "src/main.rs"
