[package]
name = "tedge-web-config"
version = "1.0.0"
edition = "2021"
authors = ["thin-edge.io Contributors"]
license = "Apache-2.0"
description = "Configuration web interface for thin-edge.io on ctrlX AUTOMATION"

[dependencies]
paho-mqtt = "0.12"
actix-web = "4.13"
actix-files = "0.6.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
uuid = { version = "1.11", features = ["v4"] }
which = "7"
# Not used directly - paho-mqtt-sys links against OpenSSL unconditionally (for its
# bundled Paho C library) and reqwest's still-enabled default-tls feature pulls in
# native-tls/openssl-sys too, even though we use rustls-tls at runtime. The
# "vendored" feature makes openssl-sys build its own OpenSSL from source for
# whichever target it's compiling for, instead of needing target-specific system
# OpenSSL dev headers (e.g. libssl-dev:arm64) installed in the cross-compile
# environment.
openssl = { version = "0.10", features = ["vendored"] }

[[bin]]
name = "tedge-web-config"
path = "src/main.rs"

[features]
mqtt = []