[package]
name = "tedge-web-config"
version = "1.0.0"
edition = "2021"
authors = ["thin-edge.io Contributors"]
license = "Apache-2.0"
description = "Configuration web interface for thin-edge.io on ctrlX AUTOMATION"

[dependencies]
paho-mqtt = "0.12"
actix-web = "4.13"
actix-files = "0.6.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
uuid = { version = "1.11", features = ["v4"] }

[dependencies.actix-http]
version = "3.12"

[dependencies.time]
version = "0.3.47"

[[bin]]
name = "tedge-web-config"
path = "src/main.rs"

[features]
mqtt = []